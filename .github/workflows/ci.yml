name: CI

# PR-only: merging to main runs deploy.yml, which repeats lint, typecheck, tests and build before publishing.
on:
  pull_request:

permissions:
  contents: read

# A newer push to the same PR supersedes the older run;.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      # `check` is a required status, so a docs-only PR must still pass it: skip the work, not the job.
      - id: scope
        run: |
          files=$(git diff --name-only HEAD^1 HEAD)
          if [ -n "$files" ] && ! echo "$files" | grep -qvE '^(docs/|[^/]+\.md$)'; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"; echo "Docs-only change: skipping checks"
          fi
      - if: steps.scope.outputs.docs_only != 'true'
        uses: ./.github/actions/setup
      - name: Lint, typecheck, test (parallel)
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          npm run lint & p1=$!
          npm run typecheck & p2=$!
          npm test & p3=$!
          fail=0
          wait $p1 || fail=1
          wait $p2 || fail=1
          wait $p3 || fail=1
          exit $fail
      - if: steps.scope.outputs.docs_only != 'true'
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.ts', '**/*.tsx') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - if: steps.scope.outputs.docs_only != 'true'
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /fundamentals-tracker

  # Desktop layout guard: builds with a throwaway login vault (never committed) and checks balance/overflow in Chromium.
  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - id: scope
        run: |
          files=$(git diff --name-only HEAD^1 HEAD)
          if [ -n "$files" ] && ! echo "$files" | grep -qvE '^(docs/|[^/]+\.md$)'; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"; echo "Docs-only change: skipping layout check"
          fi
      - if: steps.scope.outputs.docs_only != 'true'
        uses: ./.github/actions/setup
      - if: steps.scope.outputs.docs_only != 'true'
        run: LOGIN_USERNAME=e2e-user LOGIN_PASSWORD=e2e-test-password-123 npm run set-password
      - if: steps.scope.outputs.docs_only != 'true'
        run: npm run build
      - if: steps.scope.outputs.docs_only != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.scope.outputs.docs_only != 'true'
        run: npm run e2e
      - if: always() && steps.scope.outputs.docs_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: layout-screenshots
          path: test-results/
          if-no-files-found: ignore
