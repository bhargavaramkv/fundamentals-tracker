name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # The encrypted sync credential is read at runtime, so updating it needs no rebuild.
    paths-ignore: ["vault/**"]
  workflow_dispatch:
  # Called by radar.yml after the daily Tech Radar ingest, so new stories go live without a push to main.
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v5
      - name: Fetch Tech Radar data
        # Stories live on the radar-data branch (written by radar.yml); absent before the first run.
        run: |
          if git ls-remote --exit-code --heads origin radar-data >/dev/null; then
            git fetch --depth=1 origin radar-data
            mkdir -p content/radar
            git archive FETCH_HEAD | tar -x -C content/radar
            echo "Radar stories: $(ls content/radar/stories 2>/dev/null | wc -l) month file(s)"
          else
            echo "::notice title=Tech Radar::no radar-data branch yet; the radar pages will show their empty state"
          fi
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Project pages are served from /<repo>/. For a custom domain, set this to an empty string.
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      # Next's static export uses _next/ folders, which Jekyll would otherwise drop.
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
